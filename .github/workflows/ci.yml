name: CEH Quality & Test Suite

on:
  push:
    branches:
      - main
      - staging
      - dev
      - 'claude/**'
      - 'feature/**'
  pull_request:
    branches:
      - main
      - staging
      - dev
  workflow_dispatch:

jobs:
  validate:
    name: Validate (${{ matrix.os }} - Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.9', '3.12']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify Apple Legacy Bash 3.2 Behavior (macOS)
        if: runner.os == 'macOS'
        run: |
          echo "=== Apple Legacy Bash Version ==="
          /bin/bash --version

          echo "=== Syntax Check under /bin/bash 3.2 ==="
          /bin/bash -n install.sh
          /bin/bash -n uninstall.sh

          echo "=== Fail-Closed Verification under /bin/bash 3.2 ==="
          TMP_DIR=$(mktemp -d "${TMPDIR:-/tmp}/ceh-ci-bash32-XXXXXX")
          TMP_HOME="$TMP_DIR/home"
          mkdir -p "$TMP_HOME"

          # 1. Pipe execution under /bin/bash 3.2 must fail with exit code != 0 and log Bash 4.0+ requirement
          set +e
          PIPE_OUT=$(cat install.sh | HOME="$TMP_HOME" /bin/bash 2>&1)
          PIPE_EC=$?
          set -e
          echo "Pipe output: $PIPE_OUT"
          echo "Pipe exit code: $PIPE_EC"
          if [[ $PIPE_EC -eq 0 ]]; then
            echo "ERROR: /bin/bash 3.2 pipe install unexpectedly succeeded!"
            exit 1
          fi
          echo "$PIPE_OUT" | grep -F "Bash 4.0+ is required"

          # 2. Direct script execution under /bin/bash 3.2 must fail with exit code != 0 and log Bash 4.0+ requirement
          set +e
          DIRECT_OUT=$(HOME="$TMP_HOME" /bin/bash install.sh 2>&1)
          DIRECT_EC=$?
          set -e
          echo "Direct output: $DIRECT_OUT"
          echo "Direct exit code: $DIRECT_EC"
          if [[ $DIRECT_EC -eq 0 ]]; then
            echo "ERROR: /bin/bash 3.2 direct install unexpectedly succeeded!"
            exit 1
          fi
          echo "$DIRECT_OUT" | grep -F "Bash 4.0+ is required"

          rm -rf "$TMP_DIR"

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install bash
          # Ensure Homebrew GNU Bash 5+ takes precedence over Apple legacy Bash 3.2
          if [[ -d "/opt/homebrew/bin" ]]; then
            echo "/opt/homebrew/bin" >> $GITHUB_PATH
          fi
          if [[ -d "/usr/local/bin" ]]; then
            echo "/usr/local/bin" >> $GITHUB_PATH
          fi

      - name: Make scripts executable
        run: |
          chmod +x clearer-engineering/scripts/*.sh
          chmod +x clearer-engineering/tests/*.sh
          chmod +x evals/run.sh
          chmod +x install.sh
          chmod +x uninstall.sh

      - name: Syntax check on Bash scripts
        run: |
          find clearer-engineering/ -name "*.sh" -exec bash -n {} +
          bash -n install.sh
          bash -n uninstall.sh
          bash -n evals/run.sh

      - name: Syntax check on Python scripts (compileall)
        run: |
          python3 -m compileall -q clearer-engineering evals

      - name: Install Official Fixed Shellcheck (v0.11.0 with SHA-256)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: |
          SHELLCHECK_VERSION="v0.11.0"
          EXPECTED_SHA256="8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198"
          URL="https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "Downloading official shellcheck ${SHELLCHECK_VERSION} from ${URL}..."
          curl -fsSL "$URL" -o shellcheck.tar.xz
          ACTUAL_SHA256=$(sha256sum shellcheck.tar.xz | awk '{print $1}')
          echo "Validating SHA256 checksum: expected ${EXPECTED_SHA256}, got ${ACTUAL_SHA256}"
          if [[ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]]; then
            echo "ERROR: SHA256 mismatch for official shellcheck binary!"
            exit 1
          fi
          tar -xf shellcheck.tar.xz
          sudo cp "shellcheck-${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          rm -rf shellcheck.tar.xz "shellcheck-${SHELLCHECK_VERSION}"
          echo "=== Shellcheck Version & Verification ==="
          /usr/local/bin/shellcheck --version

      - name: Run Shellcheck (Strict Zero Warnings Gate - Single Job)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: |
          set -o pipefail
          mkdir -p build/reports
          ALL_SH=$(find clearer-engineering/ evals/ -name "*.sh"; echo install.sh; echo uninstall.sh)
          /usr/local/bin/shellcheck -f gcc $ALL_SH | tee build/reports/shellcheck-report.txt
          echo "=== Shellcheck Count Summary ==="
          grep -oE "SC[0-9]{4}" build/reports/shellcheck-report.txt | sort | uniq -c || true

      - name: Upload Shellcheck Report Artifact
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: shellcheck-report-ubuntu-latest-py3.12
          path: build/reports/shellcheck-report.txt
          if-no-files-found: ignore

      - name: Test One-Liner Pipe Install (Offline Mock Git)
        run: |
          TMP_DIR=$(mktemp -d "${TMPDIR:-/tmp}/ceh-ci-pipe-mock-XXXXXX")
          MOCK_GIT_DIR="$TMP_DIR/mock_git"
          mkdir -p "$MOCK_GIT_DIR"
          cat << 'EOF' > "$MOCK_GIT_DIR/git"
          #!/usr/bin/env bash
          if [[ "$1" == "clone" ]]; then
              target_dir=""
              for arg in "$@"; do
                  if [[ "$arg" != -* && "$arg" != "clone" && "$arg" != http* && "$arg" != file* ]]; then
                      target_dir="$arg"
                  fi
              done
              mkdir -p "$target_dir"
              cp -r "$GITHUB_WORKSPACE/." "$target_dir/"
              exit 0
          else
              exec /usr/bin/git "$@"
          fi
          EOF
          chmod +x "$MOCK_GIT_DIR/git"

          TMP_HOME="$TMP_DIR/home"
          OUTSIDE_DIR="$TMP_DIR/outside"
          mkdir -p "$TMP_HOME" "$OUTSIDE_DIR"

          (cd "$OUTSIDE_DIR" && cat "$GITHUB_WORKSPACE/install.sh" | HOME="$TMP_HOME" PATH="$MOCK_GIT_DIR:$PATH" bash)
          test -f "$TMP_HOME/.gemini/config/plugins/clearer-engineering/plugin.json"
          rm -rf "$TMP_DIR"

      - name: Test One-Liner Pipe Install (Real Git Clone via file://)
        run: |
          TMP_DIR=$(mktemp -d "${TMPDIR:-/tmp}/ceh-ci-pipe-real-XXXXXX")
          TMP_HOME="$TMP_DIR/home"
          OUTSIDE_DIR="$TMP_DIR/outside"
          mkdir -p "$TMP_HOME" "$OUTSIDE_DIR"

          # Tests real git clone over local filesystem protocol without internet access
          (cd "$OUTSIDE_DIR" && cat "$GITHUB_WORKSPACE/install.sh" | CEH_REPO_URL="file://$GITHUB_WORKSPACE" HOME="$TMP_HOME" bash)

          # Verify installed assets origin matches workspace commit exactly
          cmp -s "$TMP_HOME/.gemini/config/plugins/clearer-engineering/profiles/clearer-harness.agent.md" "$GITHUB_WORKSPACE/clearer-engineering/profiles/clearer-harness.agent.md"
          cmp -s "$TMP_HOME/.gemini/config/plugins/clearer-engineering/plugin.json" "$GITHUB_WORKSPACE/clearer-engineering/plugin.json"

          rm -rf "$TMP_DIR"

      - name: Run Safety Gate Unit Test Matrix (DEV, STAGING, PROD & RTK)
        run: |
          python3 clearer-engineering/tests/test_safety_matrix.py

      - name: Run Canonical Test Suite (Hermetic)
        run: |
          ./clearer-engineering/tests/run-all-tests.sh

      - name: Run Adversarial Test Suite (Controlled Regressions & Evidence)
        run: |
          ./clearer-engineering/tests/run-adversarial-tests.sh

      - name: Run Integration Scripts & Branch Topology Tests
        run: |
          bash clearer-engineering/scripts/detect-project.sh .
          bash clearer-engineering/scripts/preflight.sh
          bash clearer-engineering/scripts/diff-audit.sh
          bash clearer-engineering/scripts/evidence-report.sh
          bash clearer-engineering/scripts/ceh-help.sh

          TMP_ENT=$(mktemp -d "${TMPDIR:-/tmp}/ceh-ci-ent-XXXXXX")
          git -C "$TMP_ENT" init -b main
          git -C "$TMP_ENT" config user.name "CI"
          git -C "$TMP_ENT" config user.email "ci@clearer.dev"
          touch "$TMP_ENT/README.md"
          git -C "$TMP_ENT" add README.md
          git -C "$TMP_ENT" commit -m "init"
          bash clearer-engineering/scripts/setup-branches.sh --enterprise "$TMP_ENT"
          bash clearer-engineering/scripts/detect-project.sh "$TMP_ENT" | grep "MODO ENTERPRISE"
          rm -rf "$TMP_ENT"

          TMP_CLS=$(mktemp -d "${TMPDIR:-/tmp}/ceh-ci-cls-XXXXXX")
          git -C "$TMP_CLS" init -b main
          git -C "$TMP_CLS" config user.name "CI"
          git -C "$TMP_CLS" config user.email "ci@clearer.dev"
          touch "$TMP_CLS/README.md"
          git -C "$TMP_CLS" add README.md
          git -C "$TMP_CLS" commit -m "init"
          bash clearer-engineering/scripts/setup-branches.sh --classic "$TMP_CLS"
          bash clearer-engineering/scripts/detect-project.sh "$TMP_CLS" | grep "MODO CLÁSSICO"
          rm -rf "$TMP_CLS"

      - name: Run Install, Idempotency & Uninstall Verification
        run: |
          ./clearer-engineering/tests/run-install-verification.sh

      - name: Run Smoke Evals (Deterministic RFC 2119 criteria)
        run: |
          ./evals/run.sh

      - name: Run Document Structure & Line Budget Audit
        run: |
          bash clearer-engineering/scripts/doc-audit.sh

      - name: Run Full E2E Simulation & Integration Lifecycle
        run: |
          ./clearer-engineering/tests/run-e2e-simulation.sh

      - name: Run CEH Doctor Verification & Diagnostics
        run: |
          sh clearer-engineering/scripts/ceh-doctor.sh --self-check
          sh clearer-engineering/scripts/ceh-doctor.sh --evidence

      - name: Verify CEH Doctor under Apple Legacy Bash 3.2 (macOS)
        if: runner.os == 'macOS'
        run: |
          /bin/bash clearer-engineering/scripts/ceh-doctor.sh --self-check
          /bin/bash clearer-engineering/scripts/ceh-doctor.sh --evidence

  claude-env:
    name: Claude Code Environment Parity (ubuntu-latest - Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Make scripts executable
        run: |
          chmod +x clearer-engineering/scripts/*.sh
          chmod +x clearer-engineering/tests/*.sh
          chmod +x evals/run.sh
          chmod +x install.sh
          chmod +x uninstall.sh

      - name: Run Canonical Suite under Claude Code Environment (Parity Test)
        env:
          CLAUDECODE: "1"
          CLAUDE_PROJECT_DIR: "${{ github.workspace }}"
          CLAUDE_CODE_ENTRYPOINT: "cli"
          CLAUDE_ADDITIONAL_DIRECTORIES: "/tmp/mock-claude-dirs"
          CLAUDE_AFTER_LAST_COMPACT: "false"
          CLAUDE_AUTOCOMPACT_PCT_OVERRIDE: "50"
          CLAUDE_AUTO_BACKGROUND_TASKS: "1"
          CLAUDE_CODE_ACCOUNT_UUID: "mock-account-uuid-0000"
          CLAUDE_CODE_ADDITIONAL_DIRECTORIES_CLAUDE_MD: "1"
          CLAUDE_CODE_BASE_REF: "refs/heads/main"
          CLAUDE_CODE_CHILD_SESSION: "0"
          CLAUDE_CODE_CONTAINER_ID: "mock-container-0"
          CLAUDE_CODE_DEBUG: "0"
          CLAUDE_CODE_DIAGNOSTICS_FILE: "/tmp/mock-claude-diag.log"
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "0"
          CLAUDE_CODE_ENVIRONMENT_RUNNER_VERSION: "0.1.0"
          CLAUDE_CODE_EXECPATH: "/usr/local/bin/claude"
          CLAUDE_CODE_MESSAGING_SOCKET: "/tmp/mock-claude.sock"
          CLAUDE_CODE_ORGANIZATION_UUID: "mock-org-uuid-0000"
          CLAUDE_CODE_REMOTE: "0"
          CLAUDE_CODE_REMOTE_ENVIRONMENT_TYPE: "local"
          CLAUDE_CODE_REMOTE_SESSION_ID: "mock-remote-session-0"
          CLAUDE_CODE_SESSION_ID: "mock-session-id-0000"
          CLAUDE_CODE_VERSION: "0.2.29"
          CLAUDE_EFFORT: "high"
          CLAUDE_PID: "12345"
          USER: "runner"
        run: |
          echo "=== Executing Canonical Test Suite with Claude Code Environment Variables ==="
          ./clearer-engineering/tests/run-all-tests.sh

      - name: Run CEH Doctor under Claude Code Environment
        env:
          CLAUDECODE: "1"
          CLAUDE_PROJECT_DIR: "${{ github.workspace }}"
          CLAUDE_CODE_ENTRYPOINT: "cli"
          CLAUDE_ADDITIONAL_DIRECTORIES: "/tmp/mock-claude-dirs"
          CLAUDE_AFTER_LAST_COMPACT: "false"
          CLAUDE_AUTOCOMPACT_PCT_OVERRIDE: "50"
          CLAUDE_AUTO_BACKGROUND_TASKS: "1"
          CLAUDE_CODE_ACCOUNT_UUID: "mock-account-uuid-0000"
          CLAUDE_CODE_ADDITIONAL_DIRECTORIES_CLAUDE_MD: "1"
          CLAUDE_CODE_BASE_REF: "refs/heads/main"
          CLAUDE_CODE_CHILD_SESSION: "0"
          CLAUDE_CODE_CONTAINER_ID: "mock-container-0"
          CLAUDE_CODE_DEBUG: "0"
          CLAUDE_CODE_DIAGNOSTICS_FILE: "/tmp/mock-claude-diag.log"
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "0"
          CLAUDE_CODE_ENVIRONMENT_RUNNER_VERSION: "0.1.0"
          CLAUDE_CODE_EXECPATH: "/usr/local/bin/claude"
          CLAUDE_CODE_MESSAGING_SOCKET: "/tmp/mock-claude.sock"
          CLAUDE_CODE_ORGANIZATION_UUID: "mock-org-uuid-0000"
          CLAUDE_CODE_REMOTE: "0"
          CLAUDE_CODE_REMOTE_ENVIRONMENT_TYPE: "local"
          CLAUDE_CODE_REMOTE_SESSION_ID: "mock-remote-session-0"
          CLAUDE_CODE_SESSION_ID: "mock-session-id-0000"
          CLAUDE_CODE_VERSION: "0.2.29"
          CLAUDE_EFFORT: "high"
          CLAUDE_PID: "12345"
          USER: "runner"
        run: |
          sh clearer-engineering/scripts/ceh-doctor.sh --self-check
          sh clearer-engineering/scripts/ceh-doctor.sh --evidence

  ci-ok:
    name: CI Aggregated Status (ci-ok)
    runs-on: ubuntu-latest
    needs: [validate, claude-env]
    if: always()
    steps:
      - name: Evaluate Upstream Quality Gates
        run: |
          echo "=== CEH CI Aggregated Quality Gate Evaluation ==="
          echo "Validate Job Status: ${{ needs.validate.result }}"
          echo "Claude Environment Job Status: ${{ needs.claude-env.result }}"

          if [[ "${{ needs.validate.result }}" == "success" && "${{ needs.claude-env.result }}" == "success" ]]; then
            echo "✔ ALL REQUIRED CI GATES PASSED (ci-ok: SUCCESS)"
            exit 0
          else
            echo "✖ ONE OR MORE CI GATES FAILED"
            exit 1
          fi
